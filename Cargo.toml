[package]
name = "sapporo-gomi-ical"
version = "0.1.0"
edition = "2024"
description = "Convert Sapporo city's household waste collection calendar (CSV) to iCalendar"
license = "MIT"
repository = "https://github.com/xiupos/sapporo-gomi-ical"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
csv = "1.4.0"
icalendar = "0.17.15"
